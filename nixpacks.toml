[phases.setup]
# postgresql_16 provides pg_dump, used by the admin backup archive to dump the
# Railway PostgreSQL database into the backup zip (then mirrored to B2). Keep the
# major version aligned with the Railway Postgres server version.
# blender provides a headless USD/USDZ exporter, used by
# converters.stl_converter.convert_glb_to_usdz to generate the iOS AR Quick Look
# companion (model.usdz served as ios-src). A real ios-src USDZ is what makes AR
# launch in both Safari and Chrome on iOS, with correct real-world scale.
# mesa.osmesa provides libOSMesa, the software (GPU-less) OpenGL backend used by
# converters.poster._try_pyrender for offscreen PBR/texture thumbnail rendering.
nixPkgs = ["python312", "python312Packages.pip", "python312Packages.virtualenv", "nodejs-18_x", "postgresql_16", "blender", "mesa.osmesa", "libreoffice"]

[variables]
# Forces pyrender/PyOpenGL onto the OSMesa software renderer instead of trying
# EGL (no GPU on Railway) or a windowed GLUT/pyglet context (no display).
PYOPENGL_PLATFORM = "osmesa"

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "npm install"
]

[start]
cmd = "sh -c '/opt/venv/bin/gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 8 --timeout 180 --log-level info'"
