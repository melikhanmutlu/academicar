<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">A guided tour built from saved scenes</title>
  <desc id="d">Four saved scenes of a skull model played in order as a tour: 1, the whole skull from the side; 2, the mandible hidden; 3, an axial cut at the orbits; 4, a close-up with the cut seen face-on. Each scene stores the camera, visible layers, colours, section cut and lighting, and has its own link and QR code. Up to 12 scenes per model.</desc>
  <style>
    .frame { fill: #ffffff; stroke: #e8e8e8; stroke-width: 1.5; }
    .num { font: 700 13px Inter, system-ui, sans-serif; fill: #ffffff; }
    .h { font: 600 14px Inter, system-ui, sans-serif; fill: #202020; }
    .p { font: 400 13px Inter, system-ui, sans-serif; fill: #6b6b6b; }
    .cap { font: 600 12px Inter, system-ui, sans-serif; fill: #6b6b6b; letter-spacing: .08em; }
    .skull { fill: #f2ede4; stroke: #6b6b6b; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff682c"/>
    </marker>
    <g id="cranium">
      <path class="skull" d="M-50 10 C-56 -40, -10 -62, 26 -50 C56 -40, 64 -6, 52 18 L40 24 L30 40 L-10 40 C-30 40, -46 30, -50 10 Z"/>
      <circle cx="30" cy="2" r="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2"/>
    </g>
    <g id="mandible">
      <path class="skull" d="M-6 40 L36 40 L48 34 L50 50 C40 62, 4 64, -10 56 Z"/>
    </g>
    <g id="qr">
      <rect width="18" height="18" fill="#ffffff" stroke="#202020"/>
      <path d="M3 3 h5 v5 h-5z M10 3 h5 v5 h-5z M3 10 h5 v5 h-5z M11 11 h3 v3 h-3z" fill="#202020"/>
    </g>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text class="cap" x="20" y="28">TOUR · PLAYS THE SCENES IN ORDER</text>

  <!-- path -->
  <path d="M120 238 C180 262, 240 262, 300 238 S 420 214, 480 238 S 600 262, 660 238 S 780 214, 840 238" fill="none" stroke="#ff682c" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- 1 -->
  <g transform="translate(20 44)">
    <rect class="frame" width="200" height="170" rx="10"/>
    <g transform="translate(96 82)"><use href="#cranium"/><use href="#mandible"/></g>
    <circle cx="20" cy="20" r="12" fill="#202020"/><text class="num" x="20" y="25" text-anchor="middle">1</text>
    <g transform="translate(170 140)"><use href="#qr"/></g>
  </g>
  <text class="h" x="20" y="276">1. Whole skull, lateral</text>
  <text class="p" x="20" y="296">camera + lighting</text>

  <!-- 2 -->
  <g transform="translate(260 44)">
    <rect class="frame" width="200" height="170" rx="10"/>
    <g transform="translate(96 82)"><use href="#cranium"/><g opacity=".15"><use href="#mandible"/></g></g>
    <circle cx="20" cy="20" r="12" fill="#202020"/><text class="num" x="20" y="25" text-anchor="middle">2</text>
    <g transform="translate(170 140)"><use href="#qr"/></g>
  </g>
  <text class="h" x="260" y="276">2. Remove the mandible</text>
  <text class="p" x="260" y="296">one layer hidden</text>

  <!-- 3 -->
  <g transform="translate(500 44)">
    <rect class="frame" width="200" height="170" rx="10"/>
    <g transform="translate(96 82)">
      <clipPath id="cut"><rect x="-70" y="2" width="140" height="80"/></clipPath>
      <g clip-path="url(#cut)"><use href="#cranium"/></g>
      <line x1="-62" y1="2" x2="66" y2="2" stroke="#e5484d" stroke-width="2"/>
    </g>
    <circle cx="20" cy="20" r="12" fill="#202020"/><text class="num" x="20" y="25" text-anchor="middle">3</text>
    <g transform="translate(170 140)"><use href="#qr"/></g>
  </g>
  <text class="h" x="500" y="276">3. Axial cut at the orbits</text>
  <text class="p" x="500" y="296">section plane saved</text>

  <!-- 4 -->
  <g transform="translate(740 44)">
    <rect class="frame" width="200" height="170" rx="10"/>
    <g transform="translate(100 86)">
      <ellipse cx="0" cy="0" rx="70" ry="54" fill="#f2ede4" stroke="#6b6b6b" stroke-width="1.4"/>
      <ellipse cx="0" cy="0" rx="56" ry="42" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2"/>
      <circle cx="-22" cy="-30" r="9" fill="#ffffff" stroke="#ff682c" stroke-width="2"/>
      <circle cx="22" cy="-30" r="9" fill="#ffffff" stroke="#ff682c" stroke-width="2"/>
    </g>
    <circle cx="20" cy="20" r="12" fill="#202020"/><text class="num" x="20" y="25" text-anchor="middle">4</text>
    <g transform="translate(170 140)"><use href="#qr"/></g>
  </g>
  <text class="h" x="740" y="276">4. Cut seen face-on</text>
  <text class="p" x="740" y="296">orbits highlighted</text>

  <text class="p" x="20" y="322">Each scene: camera, visible layers, colours, section cut, background, lighting · own link + QR · up to 12 per model</text>
</svg>
