<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">From a QR code to AR, without an app</title>
  <desc id="d">A reader scans a QR code or taps a link, the model opens in the phone's browser, and View in AR hands it to the AR viewer built into the phone: AR Quick Look with a USDZ on iPhone and iPad, Google Scene Viewer with a GLB on Android. On a desktop the same button shows a QR code to continue on a phone.</desc>
  <style>
    .box { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1.2; }
    .hi { fill: #fff4ee; stroke: #ff682c; stroke-width: 1.5; }
    .lbl { font: 600 15px Inter, system-ui, sans-serif; fill: #202020; }
    .sub { font: 400 13px Inter, system-ui, sans-serif; fill: #6b6b6b; }
    .acc { font: 700 13px Inter, system-ui, sans-serif; fill: #c2410c; }
    .arr { stroke: #202020; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#202020"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <rect class="box" x="30" y="110" width="190" height="90" rx="10"/>
  <text class="lbl" x="50" y="144">1. Scan or tap</text>
  <text class="sub" x="50" y="168">QR code on a poster,</text>
  <text class="sub" x="50" y="186">slide, paper or link</text>

  <path class="arr" d="M226 155 L262 155" marker-end="url(#a)"/>

  <rect class="box" x="268" y="110" width="200" height="90" rx="10"/>
  <text class="lbl" x="288" y="144">2. Browser viewer</text>
  <text class="sub" x="288" y="168">rotate, zoom, layers;</text>
  <text class="sub" x="288" y="186">nothing to install</text>

  <path class="arr" d="M474 140 C520 140, 520 84, 562 80" marker-end="url(#a)"/>
  <path class="arr" d="M474 170 C520 170, 520 226, 562 230" marker-end="url(#a)"/>

  <rect class="hi" x="568" y="36" width="360" height="90" rx="10"/>
  <text class="lbl" x="588" y="70">3. iPhone / iPad: AR Quick Look</text>
  <text class="sub" x="588" y="94">built into iOS, opens the USDZ</text>
  <text class="acc" x="588" y="114">real-world scale, pinch to resize</text>

  <rect class="hi" x="568" y="186" width="360" height="90" rx="10"/>
  <text class="lbl" x="588" y="220">3. Android: Scene Viewer</text>
  <text class="sub" x="588" y="244">part of Google Play Services for AR</text>
  <text class="acc" x="588" y="264">opens the GLB on ARCore phones</text>

  <text class="sub" x="30" y="314">On a laptop, View in AR shows a QR code instead, so the reader continues on a phone.</text>
</svg>
