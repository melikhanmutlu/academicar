<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Live plans and sections from a building model</title>
  <desc id="d">A horizontal section plane through a building model gives a live floor plan; a vertical plane gives a live building section. The slice view draws each cut flat, with a scale bar and a snapping measure for wall thicknesses and room widths.</desc>
  <style>
    .cap { font: 600 12px Inter, system-ui, sans-serif; fill: #6b6b6b; letter-spacing: .08em; }
    .h { font: 700 16px Inter, system-ui, sans-serif; fill: #202020; }
    .p { font: 400 13px Inter, system-ui, sans-serif; fill: #6b6b6b; }
    .m { font: 600 12px Inter, system-ui, sans-serif; fill: #c2410c; }
    .wall { fill: #202020; }
    .line { stroke: #6b6b6b; stroke-width: 1.4; fill: none; }
  </style>
  <rect width="960" height="360" fill="#ffffff"/>

  <!-- building elevation with two cut planes -->
  <text class="cap" x="40" y="34">MODEL + SECTION PLANES</text>
  <g transform="translate(40 60)">
    <rect x="20" y="20" width="240" height="220" fill="#f5f5f5" stroke="#6b6b6b" stroke-width="1.5"/>
    <path class="line" d="M20 75 H260 M20 130 H260 M20 185 H260"/>
    <g fill="#ffffff" stroke="#bdbdbd">
      <rect x="40" y="36" width="36" height="24"/><rect x="122" y="36" width="36" height="24"/><rect x="204" y="36" width="36" height="24"/>
      <rect x="40" y="91" width="36" height="24"/><rect x="122" y="91" width="36" height="24"/><rect x="204" y="91" width="36" height="24"/>
      <rect x="40" y="146" width="36" height="24"/><rect x="122" y="146" width="36" height="24"/><rect x="204" y="146" width="36" height="24"/>
      <rect x="122" y="200" width="36" height="40"/>
    </g>
    <!-- horizontal plane -->
    <line x1="0" y1="105" x2="290" y2="105" stroke="#3e63dd" stroke-width="2.5" stroke-dasharray="8 5"/>
    <!-- vertical plane -->
    <line x1="180" y1="0" x2="180" y2="262" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="8 5"/>
  </g>

  <g transform="translate(40 335)">
    <line x1="0" y1="-4" x2="28" y2="-4" stroke="#3e63dd" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text class="p" x="36" y="0">horizontal → plan</text>
    <line x1="160" y1="-4" x2="188" y2="-4" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text class="p" x="196" y="0">vertical → section</text>
  </g>

  <!-- plan -->
  <text class="cap" x="380" y="34">→ LIVE PLAN</text>
  <g transform="translate(380 60)">
    <rect width="260" height="250" rx="8" fill="#fbfbfb" stroke="#e8e8e8"/>
    <g transform="translate(24 20)">
      <path class="wall" d="M0 0 H212 V8 H0 Z M0 184 H212 V192 H0 Z M0 0 H8 V192 H0 Z M204 0 H212 V192 H204 Z"/>
      <path class="wall" d="M96 8 H102 V70 H96 Z M96 100 H102 V184 H96 Z M8 110 H60 V116 H8 Z M80 110 H96 V116 H80 Z"/>
      <path class="wall" d="M102 120 H160 V126 H102 Z M180 120 H204 V126 H180 Z"/>
      <path d="M150 0 h30" stroke="#ffffff" stroke-width="8"/>
      <line x1="8" y1="150" x2="96" y2="150" stroke="#ff682c" stroke-width="1.8"/>
      <circle cx="8" cy="150" r="3" fill="#ff682c"/><circle cx="96" cy="150" r="3" fill="#ff682c"/>
      <text class="m" x="30" y="143">4.20 m</text>
    </g>
    <g transform="translate(24 228)">
      <rect width="60" height="5" fill="#202020"/><rect x="60" width="60" height="5" fill="#ffffff" stroke="#202020"/>
      <text class="p" x="126" y="7">5 m</text>
    </g>
  </g>

  <!-- section -->
  <text class="cap" x="670" y="34">→ LIVE SECTION</text>
  <g transform="translate(670 60)">
    <rect width="260" height="250" rx="8" fill="#fbfbfb" stroke="#e8e8e8"/>
    <g transform="translate(24 16)">
      <path class="wall" d="M0 196 H212 V204 H0 Z M0 141 H212 V147 H0 Z M0 86 H212 V92 H0 Z M0 31 H212 V37 H0 Z M0 0 H212 V6 H0 Z"/>
      <path class="wall" d="M0 0 H8 V204 H0 Z M204 0 H212 V204 H204 Z M96 37 H102 V86 H96 Z M96 147 H102 V196 H96 Z"/>
      <path d="M120 196 L180 147 M120 141 L180 92" stroke="#6b6b6b" stroke-width="1.4"/>
      <line x1="40" y1="92" x2="40" y2="141" stroke="#ff682c" stroke-width="1.8"/>
      <circle cx="40" cy="92" r="3" fill="#ff682c"/><circle cx="40" cy="141" r="3" fill="#ff682c"/>
      <text class="m" x="48" y="121">3.00 m</text>
    </g>
    <g transform="translate(24 230)">
      <rect width="60" height="5" fill="#202020"/><rect x="60" width="60" height="5" fill="#ffffff" stroke="#202020"/>
      <text class="p" x="126" y="7">5 m</text>
    </g>
  </g>
  <text class="p" x="380" y="340">Slide the plane to move floor by floor; the measure snaps to the cut walls.</text>
</svg>
