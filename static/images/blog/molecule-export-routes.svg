<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Three routes from a structure to a shareable 3D model</title>
  <desc id="d">ChimeraX saves a coloured GLB with save model.glb. The Mol* viewer exports geometry as GLB from its export panel. PyMOL saves OBJ with an MTL file or VRML. Each file is uploaded to AcademicAR, resized to a sensible real-world size, and shared with a link and QR code that opens in AR.</desc>
  <style>
    .box { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1.2; }
    .hi { fill: #fff4ee; stroke: #ff682c; stroke-width: 1.5; }
    .lbl { font: 600 15px Inter, system-ui, sans-serif; fill: #202020; }
    .sub { font: 400 13px Inter, system-ui, sans-serif; fill: #6b6b6b; }
    .acc { font: 700 13px Inter, system-ui, sans-serif; fill: #c2410c; }
    .arr { stroke: #202020; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#202020"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <rect class="hi" x="30" y="30" width="330" height="76" rx="10"/>
  <text class="lbl" x="50" y="62">ChimeraX</text>
  <text class="sub" x="50" y="86">save model.glb  (keeps colours)</text>

  <rect class="box" x="30" y="126" width="330" height="76" rx="10"/>
  <text class="lbl" x="50" y="158">Mol* Viewer</text>
  <text class="sub" x="50" y="182">Export Geometry panel, choose glTF</text>

  <rect class="box" x="30" y="222" width="330" height="76" rx="10"/>
  <text class="lbl" x="50" y="254">PyMOL</text>
  <text class="sub" x="50" y="278">save model.obj  (with model.mtl)</text>

  <path class="arr" d="M366 68 C420 68, 430 150, 470 158" marker-end="url(#a)"/>
  <path class="arr" d="M366 164 L470 164" marker-end="url(#a)"/>
  <path class="arr" d="M366 260 C420 260, 430 178, 470 170" marker-end="url(#a)"/>

  <rect class="box" x="476" y="118" width="210" height="96" rx="10"/>
  <text class="lbl" x="496" y="150">Upload</text>
  <text class="sub" x="496" y="174">set longest side,</text>
  <text class="sub" x="496" y="192">e.g. 30 cm for AR</text>

  <path class="arr" d="M692 166 L726 166" marker-end="url(#a)"/>
  <rect class="hi" x="732" y="118" width="200" height="96" rx="10"/>
  <text class="lbl" x="752" y="150">Link + QR</text>
  <text class="sub" x="752" y="174">browser 3D, chains</text>
  <text class="acc" x="752" y="194">as layers, AR</text>
</svg>
