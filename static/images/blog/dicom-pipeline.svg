<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">From a DICOM series to an AR-ready 3D model</title>
  <desc id="d">Five steps: upload the anonymized DICOM series as a ZIP, rebuild the volume, pick thresholds or labels that become layers, extract smoothed surface meshes, and produce a compressed GLB plus a USDZ for AR. The raw scan is deleted after conversion.</desc>
  <style>
    .box { fill: #ffffff; stroke: #e8e8e8; stroke-width: 1.5; }
    .box-accent { fill: #fff6f2; stroke: #ff682c; stroke-width: 1.5; }
    .step { font: 600 12px Inter, system-ui, sans-serif; fill: #6b6b6b; letter-spacing: .08em; }
    .h { font: 700 16px Inter, system-ui, sans-serif; fill: #202020; }
    .p { font: 400 13px Inter, system-ui, sans-serif; fill: #4d4d4d; }
    .arrow { stroke: #bdbdbd; stroke-width: 2; fill: none; }
    .note { font: 500 13px Inter, system-ui, sans-serif; fill: #4d4d4d; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bdbdbd"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>

  <!-- 1 -->
  <rect class="box" x="20" y="40" width="160" height="170" rx="10"/>
  <g transform="translate(40 66)">
    <rect x="0" y="0" width="34" height="42" rx="3" fill="#f5f5f5" stroke="#bdbdbd"/>
    <rect x="6" y="-5" width="34" height="42" rx="3" fill="#f5f5f5" stroke="#bdbdbd"/>
    <rect x="12" y="-10" width="34" height="42" rx="3" fill="#efefef" stroke="#6b6b6b"/>
  </g>
  <text class="step" x="36" y="135">STEP 1</text>
  <text class="h" x="36" y="157">DICOM series</text>
  <text class="p" x="36" y="177">anonymized, one ZIP</text>
  <text class="p" x="36" y="195">CT or MR</text>

  <path class="arrow" d="M184 125 H206" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect class="box" x="210" y="40" width="160" height="170" rx="10"/>
  <g transform="translate(236 56)" fill="none" stroke="#6b6b6b" stroke-width="1.5">
    <path d="M0 14 L22 0 L52 0 L30 14 Z" fill="#f5f5f5"/>
    <path d="M0 14 V44 H30 V14"/>
    <path d="M30 44 L52 30 V0"/>
  </g>
  <text class="step" x="226" y="135">STEP 2</text>
  <text class="h" x="226" y="157">Volume rebuilt</text>
  <text class="p" x="226" y="177">slices stacked with</text>
  <text class="p" x="226" y="195">spacing + orientation</text>

  <path class="arrow" d="M374 125 H396" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect class="box" x="400" y="40" width="160" height="170" rx="10"/>
  <g transform="translate(418 60)">
    <rect x="0" y="0" width="16" height="10" rx="2" fill="#E8D5B7"/>
    <text class="p" x="22" y="9">Bone</text>
    <rect x="0" y="16" width="16" height="10" rx="2" fill="#FFCBA4"/>
    <text class="p" x="22" y="25">Skin</text>
    <rect x="0" y="32" width="16" height="10" rx="2" fill="#CC2222"/>
    <text class="p" x="22" y="41">Vessels</text>
  </g>
  <text class="step" x="416" y="135">STEP 3</text>
  <text class="h" x="416" y="157">Layers chosen</text>
  <text class="p" x="416" y="177">HU presets, custom</text>
  <text class="p" x="416" y="195">range or labels</text>

  <path class="arrow" d="M564 125 H586" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect class="box" x="590" y="40" width="160" height="170" rx="10"/>
  <g transform="translate(610 58)" fill="none" stroke="#6b6b6b" stroke-width="1.2">
    <path d="M6 40 C 0 18, 18 2, 34 6 C 52 10, 58 30, 46 44 C 36 54, 14 54, 6 40 Z" fill="#f5f5f5"/>
    <path d="M10 22 L30 8 M8 34 L44 10 M16 46 L54 24 M30 50 L54 36"/>
  </g>
  <text class="step" x="606" y="135">STEP 4</text>
  <text class="h" x="606" y="157">Surface meshes</text>
  <text class="p" x="606" y="177">smoothed and</text>
  <text class="p" x="606" y="195">simplified per layer</text>

  <path class="arrow" d="M754 125 H776" marker-end="url(#ah)"/>

  <!-- 5 -->
  <rect class="box-accent" x="780" y="40" width="160" height="170" rx="10"/>
  <g transform="translate(802 56)">
    <rect x="0" y="0" width="30" height="50" rx="6" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
    <circle cx="15" cy="24" r="8" fill="#ff682c"/>
    <rect x="40" y="10" width="30" height="30" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
    <path d="M44 14 h8 v8 h-8z M58 14 h8 v8 h-8z M44 28 h8 v8 h-8z M58 30 h4 v4 h-4z" fill="#202020"/>
  </g>
  <text class="step" x="796" y="135">STEP 5</text>
  <text class="h" x="796" y="157">GLB + USDZ</text>
  <text class="p" x="796" y="177">viewer link, QR code</text>
  <text class="p" x="796" y="195">and AR on phones</text>

  <!-- note -->
  <rect x="20" y="236" width="920" height="44" rx="8" fill="#f5f5f5"/>
  <circle cx="44" cy="258" r="6" fill="#ff682c"/>
  <text class="note" x="60" y="263">The raw scan is deleted after conversion, whether it succeeds or fails. Only the surface meshes are kept.</text>
</svg>
