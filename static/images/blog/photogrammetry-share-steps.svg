<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">From photos to a shared 3D scan</title>
  <desc id="d">Capture overlapping photos or a LiDAR scan, reconstruct and clean the mesh in Polycam, RealityScan, Metashape, Meshroom or similar, export GLB or OBJ with its MTL and texture images, upload to AcademicAR and set the real size, then share one viewer link and QR code that opens in AR.</desc>
  <style>
    .box { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1.2; }
    .hi { fill: #fff4ee; stroke: #ff682c; stroke-width: 1.5; }
    .lbl { font: 600 15px Inter, system-ui, sans-serif; fill: #202020; }
    .sub { font: 400 13px Inter, system-ui, sans-serif; fill: #6b6b6b; }
    .acc { font: 700 13px Inter, system-ui, sans-serif; fill: #c2410c; }
    .arr { stroke: #202020; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#202020"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <rect class="box" x="20" y="110" width="170" height="100" rx="10"/>
  <text class="lbl" x="38" y="144">1. Capture</text>
  <text class="sub" x="38" y="168">overlapping photos</text>
  <text class="sub" x="38" y="186">or a LiDAR scan</text>

  <path class="arr" d="M196 160 L218 160" marker-end="url(#a)"/>
  <rect class="box" x="224" y="110" width="170" height="100" rx="10"/>
  <text class="lbl" x="242" y="144">2. Reconstruct</text>
  <text class="sub" x="242" y="168">crop the floor,</text>
  <text class="sub" x="242" y="186">fill holes, decimate</text>

  <path class="arr" d="M400 160 L422 160" marker-end="url(#a)"/>
  <rect class="box" x="428" y="110" width="170" height="100" rx="10"/>
  <text class="lbl" x="446" y="144">3. Export</text>
  <text class="sub" x="446" y="168">GLB, or OBJ +</text>
  <text class="sub" x="446" y="186">MTL + textures</text>

  <path class="arr" d="M604 160 L626 160" marker-end="url(#a)"/>
  <rect class="hi" x="632" y="110" width="140" height="100" rx="10"/>
  <text class="lbl" x="650" y="144">4. Upload</text>
  <text class="sub" x="650" y="168">set the real</text>
  <text class="sub" x="650" y="186">size in cm</text>

  <path class="arr" d="M778 160 L800 160" marker-end="url(#a)"/>
  <rect class="hi" x="806" y="110" width="134" height="100" rx="10"/>
  <text class="lbl" x="822" y="144">5. Share</text>
  <text class="sub" x="822" y="168">link, QR,</text>
  <text class="acc" x="822" y="188">AR on phones</text>

  <text class="sub" x="20" y="300">Tools: Polycam, RealityScan, Agisoft Metashape, Meshroom, RealityCapture. Clean in Blender or MeshLab if needed.</text>
</svg>
