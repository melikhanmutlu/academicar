<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
  <title id="t">Two routes from 3D Slicer to a shareable 3D link</title>
  <desc id="d">Route one exports surface models as STL or OBJ from the Segmentations module and you set the unit to millimetres on upload. Route two saves the segmentation as .seg.nrrd, and segment names and colours become one layer per structure.</desc>
  <style>
    .box { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1.2; }
    .hi { fill: #fff4ee; stroke: #ff682c; stroke-width: 1.5; }
    .lbl { font: 600 15px Inter, system-ui, sans-serif; fill: #202020; }
    .sub { font: 400 13px Inter, system-ui, sans-serif; fill: #6b6b6b; }
    .acc { font: 700 13px Inter, system-ui, sans-serif; fill: #c2410c; }
    .cap { font: 600 12px Inter, system-ui, sans-serif; fill: #6b6b6b; letter-spacing: .08em; }
    .arr { stroke: #202020; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#202020"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#ffffff"/>
  <rect class="box" x="40" y="120" width="170" height="80" rx="10"/>
  <text class="lbl" x="62" y="154">3D Slicer</text>
  <text class="sub" x="62" y="176">segmentation</text>
  <path class="arr" d="M216 145 L300 82" marker-end="url(#a)"/>
  <path class="arr" d="M216 175 L300 238" marker-end="url(#a)"/>

  <text class="cap" x="310" y="40">ROUTE 1 · SURFACE MODELS</text>
  <rect class="box" x="310" y="52" width="300" height="70" rx="10"/>
  <text class="lbl" x="330" y="82">Export to files → STL / OBJ</text>
  <text class="sub" x="330" y="104">Segmentations › Export/import models</text>
  <path class="arr" d="M616 87 H700" marker-end="url(#a)"/>
  <text class="sub" x="710" y="80">upload, unit = mm</text>
  <text class="sub" x="710" y="100">STL = one mesh</text>

  <text class="cap" x="310" y="196">ROUTE 2 · THE SEGMENTATION</text>
  <rect class="hi" x="310" y="208" width="300" height="70" rx="10"/>
  <text class="lbl" x="330" y="238">Save as .seg.nrrd</text>
  <text class="sub" x="330" y="260">File › Save Data</text>
  <path class="arr" d="M616 243 H700" marker-end="url(#a)"/>
  <text class="acc" x="710" y="236">one layer per segment</text>
  <text class="sub" x="710" y="256">names + colours kept</text>
  <text class="sub" x="40" y="306">Both routes end in a viewer link, a QR code and AR on phones.</text>
</svg>
