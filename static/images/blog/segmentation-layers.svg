<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">A label map becomes one viewer layer per structure</title>
  <desc id="d">A segmentation label map from NIfTI, NRRD or .seg.nrrd, DICOM-SEG or a ZIP of masks is converted so that each non-empty label becomes its own named, coloured layer in the viewer's Layers panel, up to 64 layers, which readers can show, hide, fade or recolour.</desc>
  <style>
    .cap { font: 600 12px Inter, system-ui, sans-serif; fill: #6b6b6b; letter-spacing: .08em; }
    .h { font: 700 16px Inter, system-ui, sans-serif; fill: #202020; }
    .p { font: 400 13px Inter, system-ui, sans-serif; fill: #6b6b6b; }
    .row { font: 500 14px Inter, system-ui, sans-serif; fill: #202020; }
    .num { font: 600 12px ui-monospace, Menlo, monospace; fill: #4d4d4d; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bdbdbd"/>
    </marker>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>

  <text class="cap" x="40" y="34">LABEL MAP (ONE SLICE)</text>
  <g transform="translate(40 50)">
    <rect width="240" height="240" rx="8" fill="#f5f5f5" stroke="#e8e8e8"/>
    <!-- labelled regions as a coarse grid look -->
    <g stroke="#ffffff" stroke-width="1">
      <path d="M40 40 h80 v20 h20 v40 h-20 v20 h-60 v-20 h-20 z" fill="#c9a0bf"/>
      <path d="M160 60 h30 v60 h-20 v-20 h-10 z" fill="#b2a6e0"/>
      <path d="M50 150 h30 v40 h-30 z" fill="#a8c8e8"/>
      <path d="M160 150 h30 v40 h-30 z" fill="#a8c8e8"/>
      <path d="M115 120 h20 v100 h-20 z" fill="#f0a0a0"/>
    </g>
    <text class="num" x="72" y="84">1</text>
    <text class="num" x="171" y="94">4</text>
    <text class="num" x="61" y="174">2</text>
    <text class="num" x="171" y="174">3</text>
    <text class="num" x="121" y="174">5</text>
  </g>
  <text class="p" x="40" y="314">NIfTI · NRRD / .seg.nrrd · DICOM-SEG · ZIP of masks</text>

  <path d="M310 170 H400" stroke="#bdbdbd" stroke-width="2" marker-end="url(#ah)"/>
  <text class="p" x="355" y="158" text-anchor="middle">one label</text>
  <text class="p" x="355" y="194" text-anchor="middle">one layer</text>

  <text class="cap" x="430" y="34">VIEWER · LAYERS PANEL</text>
  <g transform="translate(430 50)">
    <rect width="300" height="240" rx="10" fill="#ffffff" stroke="#e8e8e8"/>
    <g transform="translate(20 22)">
      <rect y="0" width="14" height="14" rx="3" fill="#b07aa1"/><text class="row" x="26" y="12">Liver</text>
      <path d="M244 7 c6 -8 18 -8 24 0 c-6 8 -18 8 -24 0 z" fill="none" stroke="#202020" stroke-width="1.3"/><circle cx="256" cy="7" r="2.6" fill="#202020"/>

      <rect y="42" width="14" height="14" rx="3" fill="#6ba3d6"/><text class="row" x="26" y="54">Left kidney</text>
      <path d="M244 49 c6 -8 18 -8 24 0 c-6 8 -18 8 -24 0 z" fill="none" stroke="#202020" stroke-width="1.3"/><circle cx="256" cy="49" r="2.6" fill="#202020"/>

      <rect y="84" width="14" height="14" rx="3" fill="#6ba3d6"/><text class="row" x="26" y="96">Right kidney</text>
      <path d="M244 91 c6 -8 18 -8 24 0 c-6 8 -18 8 -24 0 z" fill="none" stroke="#202020" stroke-width="1.3"/><circle cx="256" cy="91" r="2.6" fill="#202020"/>

      <rect y="126" width="14" height="14" rx="3" fill="#8c7bd1" opacity=".4"/><text class="row" x="26" y="138" fill-opacity=".45">Spleen</text>
      <path d="M244 133 c6 -8 18 -8 24 0 c-6 8 -18 8 -24 0 z M244 141 L268 125" fill="none" stroke="#bdbdbd" stroke-width="1.3"/>

      <rect y="168" width="14" height="14" rx="3" fill="#e5484d"/><text class="row" x="26" y="180">Aorta</text>
      <rect x="140" y="173" width="80" height="4" rx="2" fill="#efefef"/><rect x="140" y="173" width="44" height="4" rx="2" fill="#ff682c"/>
      <path d="M244 175 c6 -8 18 -8 24 0 c-6 8 -18 8 -24 0 z" fill="none" stroke="#202020" stroke-width="1.3"/><circle cx="256" cy="175" r="2.6" fill="#202020"/>
    </g>
  </g>
  <text class="p" x="430" y="314">names and colours kept where the format has them</text>

  <g transform="translate(760 70)">
    <text class="h" x="0" y="0">Readers can</text>
    <text class="p" x="0" y="28">• show or hide a structure</text>
    <text class="p" x="0" y="50">• fade it to see inside</text>
    <text class="p" x="0" y="72">• recolour or apply a finish</text>
    <text class="p" x="0" y="94">• cut it with the section plane</text>
    <text class="p" x="0" y="130">Up to 64 layers per model.</text>
  </g>
</svg>
