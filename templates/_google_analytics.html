{# Google Analytics 4 (config.GA_MEASUREMENT_ID). Left out of admin pages and
   of embeds, which run inside other people's sites. #}
{% if config.GA_MEASUREMENT_ID and not request.path.startswith('/admin') and request.args.get('embed') not in ('true', '1') %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ config.GA_MEASUREMENT_ID }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ config.GA_MEASUREMENT_ID }}');
</script>
{% endif %}
